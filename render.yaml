# Render.com blueprint — deploy with "New +" > "Blueprint" and point it at this repo.
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: darukaa-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: darukaa-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: darukaa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://darukaa-backend.onrender.com
      - key: VITE_MAPBOX_TOKEN
        sync: false
