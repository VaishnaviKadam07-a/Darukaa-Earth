[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B008: FastAPI's Depends()-as-default-argument is the framework's documented
# pattern, not a real "mutable default" bug — safe to ignore here.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["."]
